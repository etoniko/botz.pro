    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <style>
        :root {
            --vk: #0077ff;
            --vk-hover: #0066dd;
            --vk-soft: #e5f1ff;
            --bg: #edeef0;
            --panel: #ffffff;
            --line: #dce1e6;
            --text: #000000;
            --muted: #818c99;
            --ok: #4bb34b;
            --warn: #ff9e00;
            --danger: #e64646;
            --header: #0077ff;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #c5d0db transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { color: var(--vk); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            background: var(--header);
            color: #fff;
            height: 48px;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12);
        }
        .topbar-inner {
            max-width: 960px;
            margin: 0 auto;
            height: 100%;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .logo {
            color: #fff;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.03em;
            text-decoration: none;
            flex-shrink: 0;
        }
        .logo:hover { text-decoration: none; color: #fff; }
        .logo span { font-weight: 600; opacity: 0.88; }
        .top-nav {
            display: flex;
            gap: 4px;
            min-width: 0;
        }
        .top-nav a {
            color: #fff;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 6px 10px;
            border-radius: 6px;
            text-decoration: none;
            opacity: 0.92;
        }
        .top-nav a:hover {
            background: rgba(255, 255, 255, 0.14);
            text-decoration: none;
            opacity: 1;
        }

        .wrap { max-width: 960px; margin: 0 auto; padding: 16px 12px 48px; }

        .hero {
            background: var(--panel);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 22px 22px 18px;
            margin-bottom: 12px;
        }
        .hero h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .hero .sub {
            color: var(--muted);
            margin-top: 4px;
            font-size: 0.92rem;
        }
        .hero .authors {
            margin-top: 10px;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .card {
            background: var(--panel);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 16px 18px;
            margin-bottom: 12px;
        }
        .card h2 {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .script {
            user-select: text;
            background: #f5f6f8;
            color: #222;
            padding: 16px 88px 16px 14px;
            border-radius: 8px;
            font-family: ui-monospace, "Cascadia Code", Consolas, monaco, monospace;
            font-size: 13.5px;
            overflow-x: auto;
            position: relative;
            border: 1px solid var(--line);
        }
        .copy {
            position: absolute; top: 8px; right: 8px;
            background: var(--vk); color: #fff; border: none;
            padding: 6px 12px; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 0.8rem; font-family: inherit;
        }
        .copy:hover { background: var(--vk-hover); }

        .steps {
            margin: 14px 0 0 18px;
            color: #2c2d2e;
            font-size: 0.92rem;
        }
        .steps li { margin: 5px 0; }
        html[dir="rtl"] .steps { margin: 14px 18px 0 0; }

        .live-bar {
            display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
            margin-bottom: 10px;
        }
        .live-bar h2 { font-size: 1rem; font-weight: 700; margin: 0 6px 0 0; }
        .pill {
            display: inline-flex; gap: 6px; align-items: center;
            background: #f0f2f5; border-radius: 999px;
            padding: 5px 11px; font-size: 0.8rem; color: var(--muted);
            font-weight: 500;
        }
        .pill b { color: var(--ok); font-variant-numeric: tabular-nums; font-weight: 700; }
        .pill b.warn { color: var(--warn); }
        .pill .dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
            box-shadow: 0 0 0 3px rgba(75, 179, 75, 0.18);
        }
        .pill.offline .dot { background: var(--danger); box-shadow: 0 0 0 3px rgba(230, 70, 70, 0.16); }

        .hint-scroll {
            color: var(--muted); font-size: 0.75rem; margin: 0 0 8px;
        }
        #rail-wrap {
            margin: 0 -6px;
            padding: 0 6px 4px;
            position: relative;
        }
        #grid {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            padding: 2px 2px 8px;
            cursor: grab;
            touch-action: pan-y;
            overscroll-behavior-x: contain;
        }
        #grid.dragging {
            cursor: grabbing;
            scroll-snap-type: none;
            scroll-behavior: auto;
        }
        #grid::-webkit-scrollbar { display: none; width: 0; height: 0; }
        #grid::after {
            content: "";
            flex: 0 0 max(12px, calc(100% - 240px));
            height: 1px;
        }
        #rail-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
            min-height: 18px;
            padding: 6px 0 2px;
        }
        .rail-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 0;
            padding: 0;
            background: #c5d0db;
            cursor: pointer;
            transition: background .15s, transform .15s;
        }
        .rail-dot:hover { background: var(--muted); }
        .rail-dot.active {
            background: var(--vk);
            transform: scale(1.25);
            box-shadow: 0 0 0 3px rgba(0, 119, 255, 0.18);
        }
        .srv {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            flex: 0 0 240px;
            width: 240px;
            max-width: 240px;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            flex-direction: column;
            min-height: 0;
            box-shadow: var(--shadow);
        }
        .srv-head { padding: 9px 11px 7px; border-bottom: 1px solid var(--line); background: #fafbfc; }
        .srv-title-row {
            display: flex; align-items: center; gap: 6px; min-width: 0;
        }
        .srv-title {
            flex: 1; min-width: 0;
            font-size: 0.7rem; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .copy-wss {
            flex-shrink: 0;
            width: 28px; height: 28px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: var(--vk);
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0;
        }
        .copy-wss:hover { border-color: var(--vk); background: var(--vk-soft); }
        .copy-wss.ok { color: var(--ok); border-color: var(--ok); }
        .copy-wss svg { width: 14px; height: 14px; display: block; }
        .srv-body { min-height: 0; }
        .lb { padding: 8px 10px 10px; overflow: hidden; }
        .lb h3 {
            margin: 0 0 4px; font-size: 0.55rem; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .lb ol {
            margin: 0; padding: 0;
            font-size: 0.72rem; line-height: 1.35;
            list-style: none;
        }
        .lb li {
            margin: 0; padding: 0; height: 1.35em;
            display: flex; gap: 4px; align-items: baseline;
            white-space: nowrap; overflow: hidden;
        }
        .lb .rk {
            flex-shrink: 0; width: 1.5em;
            color: var(--muted); font-variant-numeric: tabular-nums;
        }
        .lb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .lb .empty { color: var(--muted); font-size: 0.7rem; }
        .empty-state {
            flex: 0 0 100%;
            text-align: center; color: var(--muted);
            padding: 28px 16px; border: 1px dashed var(--line); border-radius: 12px;
            background: #fff;
        }
        .srv.skel { pointer-events: none; }
        .skel-line {
            height: 8px;
            border-radius: 6px;
            background: linear-gradient(90deg, #eef0f3 0%, #e2e6eb 45%, #eef0f3 100%);
            background-size: 200% 100%;
            animation: shimmer 1.15s ease-in-out infinite;
        }
        .skel-line.lg { height: 12px; }
        .skel-line.sm { height: 6px; width: 70%; }
        .skel-lb { display: flex; flex-direction: column; gap: 5px; padding-top: 4px; }
        .skel-lb .skel-line { width: 100%; }
        .skel-lb .skel-line:nth-child(odd) { width: 88%; }
        .skel-lb .skel-line:nth-child(3n) { width: 72%; }
        .skel-head-row { display: flex; align-items: center; gap: 8px; }
        .skel-head-row .skel-line { flex: 1; }
        .skel-btn {
            width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
            background: linear-gradient(90deg, #eef0f3 0%, #e2e6eb 45%, #eef0f3 100%);
            background-size: 200% 100%;
            animation: shimmer 1.15s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .sponsor-card {
            position: relative; overflow: hidden; border-radius: 12px;
            margin: 12px 0; color: #fff; text-align: center; padding: 40px 28px;
            box-shadow: var(--shadow);
        }
        .sponsor-card::before {
            content: ""; position: absolute; inset: 0; background: rgba(0, 28, 61, 0.55); z-index: 1;
        }
        .sponsor-video {
            position: absolute; top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            transform: translate(-50%, -50%); object-fit: cover; z-index: 0;
        }
        .sponsor-content { position: relative; z-index: 2; }
        .sponsor-content h3 { font-size: 1.2rem; font-weight: 700; }
        .sponsor-content p { opacity: 0.92; margin: 6px 0 4px; }
        .sponsor-btn {
            background: #fff; color: var(--vk); padding: 10px 24px; border-radius: 8px;
            font-weight: 700; display: inline-block; margin-top: 10px; text-decoration: none;
        }
        .sponsor-btn:hover { text-decoration: none; background: var(--vk-soft); }

        .warn-box {
            background: #fff8e8;
            border: 1px solid #ffe3a3;
            border-radius: 12px;
            padding: 14px 16px;
            color: #5c4a1f;
            margin: 12px 0 0;
            font-size: 0.9rem;
        }
        .warn-box strong { color: #3d320f; }

        footer {
            text-align: center;
            padding: 20px 12px 28px;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .notranslate, .script, .copy, code, pre { translate: no !important; }

        @media (max-width: 640px) {
            .topbar-inner { gap: 10px; }
            .top-nav a { padding: 6px 8px; font-size: 0.8rem; }
            .hero { padding: 16px; }
        }
    </style>

      function detectLang() {
        const raw = String(navigator.language || navigator.userLanguage || 'en').toLowerCase();
        if (raw.startsWith('ru')) return 'ru';
        if (raw.startsWith('uk')) return 'uk';
        if (raw.startsWith('ar')) return 'ar';
        if (raw.startsWith('tr')) return 'tr';
        if (raw.startsWith('zh')) return 'zh';
        if (raw.startsWith('fr')) return 'fr';
        if (raw.startsWith('pl')) return 'pl';
        return 'en';
      }

      const LANG = detectLang();
      const T = I18N[LANG] || I18N.en;
      document.documentElement.lang = LANG === 'zh' ? 'zh' : LANG;
      document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
      document.title = 'botz.pro — ' + T.title;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const k = el.getAttribute('data-i18n');
        if (!T[k]) return;
        if (k.indexOf('step') === 0) el.innerHTML = T[k];
        else el.textContent = T[k];
      });
      document.getElementById('copyBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(document.getElementById('scriptText').textContent).then(() => {
          const btn = document.getElementById('copyBtn');
          btn.textContent = T.copied;
          setTimeout(() => { btn.textContent = T.copy; }, 1200);
        }).catch(() => {});
      });

      const API = 'https://sixz.ru:6001/api/status';
      const grid = document.getElementById('grid');
      const dotsBox = document.getElementById('rail-dots');

      let drag = null;
      let suppressClick = false;

      function cards() {
        return [...grid.querySelectorAll('.srv')];
      }

      function cardScrollLeft(el) {
        const list = cards();
        if (!list.length) return 0;
        return el.offsetLeft - list[0].offsetLeft;
      }

      function nearestIndex() {
        const list = cards();
        if (!list.length) return 0;
        let best = 0;
        let bestDist = Infinity;
        const left = grid.scrollLeft;
        list.forEach((el, i) => {
          const d = Math.abs(cardScrollLeft(el) - left);
          if (d < bestDist) {
            bestDist = d;
            best = i;
          }
        });
        return best;
      }

      function goTo(i, smooth) {
        const list = cards();
        if (!list.length) return;
        i = Math.max(0, Math.min(list.length - 1, i));
        const max = Math.max(0, grid.scrollWidth - grid.clientWidth);
        const left = Math.min(max, Math.max(0, cardScrollLeft(list[i])));
        grid.scrollTo({
          left,
          behavior: smooth ? 'smooth' : 'auto'
        });
        syncDots(i);
      }

      function syncDots(forceIndex) {
        const list = cards();
        const n = list.length;
        if (!n) {
          dotsBox.innerHTML = '';
          return;
        }
        if (dotsBox.children.length !== n) {
          dotsBox.innerHTML = '';
          for (let i = 0; i < n; i++) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'rail-dot';
            b.dataset.i = String(i);
            b.setAttribute('aria-label', 'server ' + (i + 1));
            dotsBox.appendChild(b);
          }
        }
        const active = forceIndex != null ? forceIndex : nearestIndex();
        [...dotsBox.children].forEach((d, i) => {
          d.classList.toggle('active', i === active);
        });
      }

      dotsBox.addEventListener('click', (e) => {
        const btn = e.target.closest('.rail-dot');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        goTo(Number(btn.dataset.i) || 0, true);
      });

      grid.addEventListener('scroll', () => {
        if (drag) return;
        syncDots();
      }, { passive: true });
      window.addEventListener('resize', () => syncDots());

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
      }

      const COPY_ICON =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<rect x="9" y="9" width="13" height="13" rx="2"></rect>' +
        '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>' +
        '</svg>';

      function lbHtml(top) {
        if (!top.length) return '<div class="empty">' + escapeHtml(T.emptyTop) + '</div>';
        return '<ol>' + top.map((e, i) =>
          '<li><span class="rk">' + (i + 1) + '.</span>' +
          '<span class="nm">' + escapeHtml(e.name || '?') + '</span></li>'
        ).join('') + '</ol>';
      }

      function makeCard(s) {
        const card = document.createElement('div');
        card.className = 'srv';
        card.dataset.url = s.url || '';
        card.innerHTML =
          '<div class="srv-head">' +
            '<div class="srv-title-row">' +
              '<div class="srv-title"></div>' +
              '<button type="button" class="copy-wss" title="' + escapeHtml(T.copyWss) + '" aria-label="' + escapeHtml(T.copyWss) + '">' + COPY_ICON + '</button>' +
            '</div>' +
          '</div>' +
          '<div class="srv-body">' +
            '<div class="lb"><h3>' + escapeHtml(T.top10) + '</h3><div class="lb-body"></div></div>' +
          '</div>';
        card.querySelector('.copy-wss').addEventListener('click', (ev) => {
          if (suppressClick) {
            ev.preventDefault();
            ev.stopPropagation();
            return;
          }
          ev.preventDefault();
          ev.stopPropagation();
          const url = card.dataset.url || '';
          navigator.clipboard.writeText(url).then(() => {
            const btn = card.querySelector('.copy-wss');
            btn.classList.add('ok');
            setTimeout(() => btn.classList.remove('ok'), 900);
          }).catch(() => {});
        });
        fillCard(card, s);
        return card;
      }

      function fillCard(card, s) {
        const wss = s.url || '';
        const top = (s.leaderboard || []).slice(0, 10);
        card.dataset.url = wss;
        const title = card.querySelector('.srv-title');
        title.textContent = s.short || wss || 'server';
        title.title = wss;
        card.querySelector('.lb-body').innerHTML = lbHtml(top);
      }

      function skelCardHtml() {
        const rows = Array.from({ length: 10 }, (_, i) =>
          '<div class="skel-line sm" style="animation-delay:' + (i * 0.05) + 's"></div>'
        ).join('');
        return (
          '<div class="srv skel">' +
            '<div class="srv-head">' +
              '<div class="skel-head-row"><div class="skel-line lg"></div><div class="skel-btn"></div></div>' +
            '</div>' +
            '<div class="srv-body">' +
              '<div class="lb"><h3>' + escapeHtml(T.top10) + '</h3><div class="skel-lb">' + rows + '</div></div>' +
            '</div>' +
          '</div>'
        );
      }

      function showSkeletons(count) {
        const n = count || 3;
        let html = '';
        for (let i = 0; i < n; i++) html += skelCardHtml();
        grid.innerHTML = html;
        dotsBox.innerHTML = '';
        for (let i = 0; i < n; i++) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'rail-dot';
          b.disabled = true;
          dotsBox.appendChild(b);
        }
        if (dotsBox.firstChild) dotsBox.firstChild.classList.add('active');
      }

      function render(data) {
        const servers = (data.servers || []).filter((s) => (s.bots || 0) > 0 || (s.alive || 0) > 0);
        document.getElementById('alive').textContent = data.alive || 0;
        document.getElementById('bots').textContent = data.bots || 0;
        document.getElementById('wss').textContent = servers.length;
        const massAll = servers.reduce((s, x) => s + (x.mass || 0), 0);
        document.getElementById('massAll').textContent = Math.round(massAll);
        const st = document.getElementById('apiState');
        st.classList.remove('offline');
        st.innerHTML = '<span class="dot"></span> ' + T.live;

        const scrollX = grid.scrollLeft;
        const wasDragging = !!drag;

        if (!servers.length) {
          if (!grid.querySelector('.srv.skel') && !grid.querySelector('.srv:not(.skel)')) {
            showSkeletons(3);
          }
          return;
        }

        [...grid.querySelectorAll('.srv.skel')].forEach((el) => el.remove());
        const empty = grid.querySelector('.loader, .empty-state');
        if (empty) empty.remove();

        const byUrl = Object.create(null);
        [...grid.querySelectorAll('.srv')].forEach((el) => {
          byUrl[el.dataset.url] = el;
        });

        const keep = new Set(servers.map((s) => s.url));
        Object.keys(byUrl).forEach((url) => {
          if (!keep.has(url)) {
            byUrl[url].remove();
            delete byUrl[url];
          }
        });

        let prev = null;
        servers.forEach((s) => {
          let card = byUrl[s.url];
          if (!card) {
            card = makeCard(s);
            byUrl[s.url] = card;
          } else {
            fillCard(card, s);
          }
          if (prev) {
            if (prev.nextSibling !== card) prev.after(card);
          } else if (grid.firstChild !== card) {
            grid.prepend(card);
          }
          prev = card;
        });

        if (!wasDragging) {
          grid.scrollLeft = scrollX;
          requestAnimationFrame(() => {
            grid.scrollLeft = scrollX;
            syncDots();
          });
        } else {
          syncDots();
        }
      }

      grid.addEventListener('pointerdown', (e) => {
        if (e.target.closest('button, a, input')) return;
        drag = {
          id: e.pointerId,
          x: e.clientX,
          left: grid.scrollLeft,
          moved: false
        };
        suppressClick = false;
        grid.classList.add('dragging');
        try { grid.setPointerCapture(e.pointerId); } catch (_) {}
      });

      grid.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        const dx = e.clientX - drag.x;
        if (Math.abs(dx) > 4) drag.moved = true;
        grid.scrollLeft = drag.left - dx;
        syncDots();
      });

      function endDrag(e) {
        if (!drag || (e && e.pointerId !== drag.id)) return;
        const moved = drag.moved;
        drag = null;
        grid.classList.remove('dragging');
        if (moved) {
          suppressClick = true;
          setTimeout(() => { suppressClick = false; }, 80);
          goTo(nearestIndex(), true);
        } else {
          syncDots();
        }
      }

      grid.addEventListener('pointerup', endDrag);
      grid.addEventListener('pointercancel', endDrag);
      grid.addEventListener('lostpointercapture', endDrag);

      async function tick() {
        try {
          const r = await fetch(API, { cache: 'no-store' });
          if (!r.ok) throw new Error('bad status');
          render(await r.json());
        } catch (e) {
          const st = document.getElementById('apiState');
          st.classList.add('offline');
          st.innerHTML = '<span class="dot"></span> ' + T.offline;
          if (!grid.querySelector('.srv')) {
            showSkeletons(3);
          }
        }
      }
      tick();
      setInterval(tick, 1500);
      showSkeletons(3);
    </script>
